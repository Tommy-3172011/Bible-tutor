<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bible Reader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,600&family=Instrument+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1f4; --paper:#fbfcfd; --ink:#1b2430; --muted:#5d6b7b; --line:#d5dce4;
  --accent:#1f4e79; --accent-ink:#fff; --hi:#dbe8f5; --panel:#fff;
  --serif:'Newsreader',Georgia,serif; --sans:'Instrument Sans',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#10161d;--paper:#161e27;--ink:#e6ebf1;--muted:#93a1b1;--line:#2a3542;--accent:#7fb2e5;--accent-ink:#0d1620;--hi:#22354a;--panel:#1b2530}
}
:root[data-theme="dark"]{--bg:#10161d;--paper:#161e27;--ink:#e6ebf1;--muted:#93a1b1;--line:#2a3542;--accent:#7fb2e5;--accent-ink:#0d1620;--hi:#22354a;--panel:#1b2530}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
header{display:flex;align-items:center;gap:.75rem;padding:.6rem 1rem;background:var(--paper);border-bottom:1px solid var(--line)}
header h1{font:600 1.15rem var(--serif);margin:0;flex:1}
button{font:inherit;color:inherit;background:none;border:1px solid var(--line);border-radius:6px;padding:.4rem .75rem;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.support{font-size:.85rem;color:var(--muted)}
#layout{flex:1;display:flex;min-height:0}
nav{width:250px;overflow-y:auto;background:var(--paper);border-right:1px solid var(--line);padding:.5rem 0}
nav h2{font:600 .8rem var(--sans);color:var(--muted);margin:.9rem 1rem .3rem}
nav button{display:block;width:100%;text-align:left;border:0;border-radius:0;padding:.35rem 1rem}
nav button.on{background:var(--hi);font-weight:600}
#chapters{display:flex;flex-wrap:wrap;gap:.3rem;padding:.4rem 1rem .8rem}
#chapters button{width:2.4rem;padding:.3rem 0;text-align:center;border:1px solid var(--line);border-radius:6px}
#chapters button.on{background:var(--accent);color:var(--accent-ink)}
main{flex:1;overflow-y:auto;padding:1.5rem 1rem 8rem}
article{max-width:38rem;margin:0 auto;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:1.5rem 1.5rem 2rem}
article h2{font:600 1.9rem var(--serif);margin:0 0 1rem}
.v{font:400 1.2rem/1.75 var(--serif);cursor:pointer;border-radius:4px;padding:.1rem .15rem;display:block}
.v:hover{background:var(--hi)}
.v.sel{background:var(--hi);box-shadow:inset 3px 0 0 var(--accent);padding-left:.5rem}
.v sup{font:600 .7rem var(--sans);color:var(--accent);margin-right:.35rem}
.pager{display:flex;justify-content:space-between;max-width:38rem;margin:1rem auto 0}
.hint{max-width:38rem;margin:0 auto .75rem;color:var(--muted);font-size:.9rem}
#panel{position:fixed;right:0;bottom:0;top:auto;width:100%;max-height:60vh;background:var(--panel);border-top:2px solid var(--accent);box-shadow:0 -6px 24px rgba(0,0,0,.18);transform:translateY(105%);transition:transform .25s;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
#panel.open{transform:none}
@media (prefers-reduced-motion:reduce){#panel{transition:none}}
#panel .top{display:flex;justify-content:space-between;align-items:center;padding:.7rem 1rem;border-bottom:1px solid var(--line)}
#panel .top b{font:600 1rem var(--serif)}
#panel .body{overflow-y:auto;padding:1rem}
#quote{font:italic 1.05rem/1.6 var(--serif);color:var(--muted);margin:0 0 1rem}
#out{white-space:pre-wrap;line-height:1.65;font-size:1rem}
.note{font-size:.8rem;color:var(--muted);margin-top:1rem}
#bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:.6rem 0}
#bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
#chat .b{margin:.75rem 0;padding:.6rem .8rem;border-radius:8px;white-space:pre-wrap;line-height:1.6}
#chat .you{background:var(--hi)}
#chat .ai{border:1px solid var(--line)}
#ask{display:flex;gap:.5rem;padding:.7rem 1rem;border-top:1px solid var(--line)}
#ask input{flex:1;min-width:0;font:inherit;font-size:16px;padding:.5rem .7rem;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink)}
#menu{display:none}
@media (min-width:900px){#panel{width:420px;top:0;max-height:none;border-top:0;border-left:2px solid var(--accent);transform:translateX(105%)}#panel.open{transform:none}}
@media (max-width:899px){
  nav{position:fixed;inset:0 20% 0 0;z-index:5;transform:translateX(-105%);transition:transform .2s;padding-top:calc(.5rem + env(safe-area-inset-top,0px))}
  nav.open{transform:none;box-shadow:6px 0 24px rgba(0,0,0,.25)}
  #menu{display:inline-block}
  .support{display:none}
}
#load{max-width:38rem;margin:3rem auto;padding:0 1rem}
#load h2{font:600 1.5rem var(--serif)}
</style>
</head>
<body>
<header>
  <button id="menu" aria-label="Open books">Books</button>
  <h1>Bible Reader</h1>
  <!-- STRIPE: put your Stripe payment link or button here later -->
  <span class="support" id="stripe-slot"></span>
  <button id="theme" aria-label="Toggle dark mode">Dark</button>
</header>
<div id="layout">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<aside id="panel" aria-live="polite">
  <div class="top"><b id="ref"></b><button id="close">Close</button></div>
  <div class="body">
    <p id="quote"></p>
    <div id="status"></div>
    <div id="out"></div>
    <div id="chat"></div>
    <p class="note" id="note" hidden>AI-generated. It can make mistakes. <span id="left"></span></p>
  </div>
  <div id="ask" hidden>
    <input id="q" type="text" placeholder="Ask a question about this verse" autocomplete="off" enterkeyhint="send">
    <button id="send" class="primary">Ask</button>
  </div>
</aside>

<script type="module">

const $ = id => document.getElementById(id);
let books = [], bi = 0, ci = 0, sel = null, gen = null, genLoading = null, busy = false;

/* ---------- storage helpers ---------- */
const store = {
  get(k){ try{ return localStorage.getItem(k) }catch{ return null } },
  set(k,v){ try{ localStorage.setItem(k,v) }catch{} }
};

/* ---------- theme ---------- */
const root = document.documentElement;
const savedTheme = store.get("theme");
if (savedTheme) root.dataset.theme = savedTheme;
$("theme").onclick = () => {
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme:dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  store.set("theme", root.dataset.theme);
};

/* ---------- load the Bible (supports several common JSON layouts) ---------- */
function normalize(data){
  if (data && data.books) data = data.books;
  if (data && data.verses) data = data.verses;
  if (Array.isArray(data) && data[0] && data[0].chapters) {           // [{name, chapters:[[v,..],..]}]
    const list = data.map((b,i)=>({ name: b.name || b.book || `Book ${i+1}`, chapters: b.chapters.map(ch => {
      const arr = Array.isArray(ch) ? ch : (ch.verses || Object.values(ch));
      return arr.map(v => typeof v === "string" ? v : (v.text || ""));
    }) }));
    if (list.length === 66) list.forEach((b,i)=>{ b.name = BOOK_NAMES[i]; });
    return list;
  }
  if (Array.isArray(data) && data[0] && "text" in data[0]) {          // flat verse list
    const map = new Map();
    for (const v of data) {
      const name = v.book_name || v.book || v.bookname;
      const c = +v.chapter, n = +v.verse;
      if (!map.has(name)) map.set(name, []);
      const chs = map.get(name);
      (chs[c-1] ||= [])[n-1] = (v.text||"").trim();
    }
    return [...map].map(([name,chapters])=>({name, chapters: chapters.map(c=>c||[])}));
  }
  if (data && typeof data === "object") {                             // {Book:{"1":{"1":"text"}}}
    return Object.entries(data).map(([name,chs]) => ({
      name,
      chapters: Object.keys(chs).sort((a,b)=>a-b).map(c => {
        const vs = chs[c]; return Array.isArray(vs) ? vs : Object.keys(vs).sort((a,b)=>a-b).map(k=>vs[k]);
      })
    }));
  }
  throw new Error("Unrecognized Bible JSON format");
}

const BOOK_NAMES = ["Genesis","Exodus","Leviticus","Numbers","Deuteronomy","Joshua","Judges","Ruth","1 Samuel","2 Samuel","1 Kings","2 Kings","1 Chronicles","2 Chronicles","Ezra","Nehemiah","Esther","Job","Psalms","Proverbs","Ecclesiastes","Song of Solomon","Isaiah","Jeremiah","Lamentations","Ezekiel","Daniel","Hosea","Joel","Amos","Obadiah","Jonah","Micah","Nahum","Habakkuk","Zephaniah","Haggai","Zechariah","Malachi","Matthew","Mark","Luke","John","Acts","Romans","1 Corinthians","2 Corinthians","Galatians","Ephesians","Philippians","Colossians","1 Thessalonians","2 Thessalonians","1 Timothy","2 Timothy","Titus","Philemon","Hebrews","James","1 Peter","2 Peter","1 John","2 John","3 John","Jude","Revelation"];
const REMOTE_BIBLE = "https://raw.githubusercontent.com/midvash/bible-data/main/versions/en/kjv/kjv.json";

async function start(){
  $("main").innerHTML = `<div id="load"><h2>Loading the Bible…</h2><p>This takes a few seconds the first time.</p></div>`;
  try {
    let r = await fetch("bible.json").catch(() => null);          // your own file wins if you add one
    if (!r || !r.ok) r = await fetch(REMOTE_BIBLE);               // otherwise load the KJV from the web
    if (!r.ok) throw new Error("Bible file not found");
    books = normalize(await r.json());
    init();
  } catch (e) {
    console.error(e);
    $("main").innerHTML = `<div id="load"><h2>Add your Bible file</h2>
      <p>The Bible could not be loaded from the internet. Check your connection and reload, or choose a Bible JSON file from your computer.</p>
      <input type="file" id="pick" accept=".json,application/json"></div>`;
    $("pick").onchange = async ev => {
      try { books = normalize(JSON.parse(await ev.target.files[0].text())); init(); }
      catch { alert("That file's layout wasn't recognized. See the README for supported formats."); }
    };
  }
}

/* ---------- UI ---------- */
function init(){
  const s = JSON.parse(store.get("pos") || "null");
  if (s && books[s.b]) { bi = s.b; ci = Math.min(s.c, books[s.b].chapters.length-1); }
  buildNav(); show();
}

function buildNav(){
  const nav = $("nav");
  nav.innerHTML = "";
  books.forEach((b,i)=>{
    if (books.length === 66 && (i===0 || i===39)) {
      const h = document.createElement("h2"); h.textContent = i===0 ? "Old Testament" : "New Testament"; nav.append(h);
    }
    const btn = document.createElement("button");
    btn.textContent = b.name; btn.dataset.i = i;
    btn.onclick = () => { bi = i; ci = 0; show(); };
    nav.append(btn);
    if (i === bi) { const ch = document.createElement("div"); ch.id = "chapters"; ch.dataset.for = i; nav.append(ch); }
  });
}

function renderChapterButtons(){
  const old = $("chapters"); if (old) old.remove();
  const btns = [...$("nav").querySelectorAll("button[data-i]")];
  btns.forEach(b => b.classList.toggle("on", +b.dataset.i === bi));
  const cur = btns.find(b => +b.dataset.i === bi);
  const box = document.createElement("div"); box.id = "chapters";
  books[bi].chapters.forEach((_,c)=>{
    const b = document.createElement("button");
    b.textContent = c+1; b.className = c===ci ? "on" : "";
    b.onclick = () => { ci = c; show(); closeNav(); };
    box.append(b);
  });
  cur.after(box);
}

function show(){
  const b = books[bi], verses = b.chapters[ci] || [];
  store.set("pos", JSON.stringify({b:bi,c:ci}));
  renderChapterButtons();
  const main = $("main");
  main.innerHTML = `<p class="hint">Tap any verse to get a plain-English explanation.</p>
    <article><h2>${b.name} ${ci+1}</h2></article><div class="pager"><button id="prev">Previous</button><button id="next">Next</button></div>`;
  const art = main.querySelector("article");
  verses.forEach((t,i)=>{
    const p = document.createElement("span");
    p.className = "v"; p.tabIndex = 0; p.setAttribute("role","button");
    p.innerHTML = `<sup>${i+1}</sup>`; p.append(document.createTextNode(t));
    const go = () => { document.querySelectorAll(".v.sel").forEach(x=>x.classList.remove("sel")); p.classList.add("sel"); explain(i+1, t); };
    p.onclick = go; p.onkeydown = e => { if (e.key==="Enter"||e.key===" "){ e.preventDefault(); go(); } };
    art.append(p);
  });
  $("prev").onclick = () => step(-1); $("next").onclick = () => step(1);
  main.scrollTop = 0; closePanel();
}

function step(d){
  ci += d;
  if (ci < 0) { if (bi>0) { bi--; ci = books[bi].chapters.length-1; } else ci = 0; }
  else if (ci >= books[bi].chapters.length) { if (bi<books.length-1) { bi++; ci = 0; } else ci = books[bi].chapters.length-1; }
  buildNav(); show();
}

const closeNav = () => $("nav").classList.remove("open");
$("menu").onclick = () => $("nav").classList.toggle("open");
function closePanel(){ $("panel").classList.remove("open"); $("ask").hidden = true; }
$("close").onclick = () => { closePanel(); document.querySelectorAll(".v.sel").forEach(x=>x.classList.remove("sel")); };

/* ---------- answers come from our server (fast, saved after the first ask) ---------- */
let vid = store.get("vid");
if (!vid) { vid = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2) + Date.now()); store.set("vid", vid); }
let convo = [], tapId = 0, curB = 0, curC = 0, curV = 1;

async function callApi(payload){
  const r = await fetch("/api/ask", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ ...payload, vid }) });
  let d = {}; try { d = await r.json(); } catch {}
  if (!r.ok) throw new Error(d.message || "Something went wrong. Please try again.");
  return d;
}
const scrollDown = () => { const b = $("panel").querySelector(".body"); b.scrollTop = b.scrollHeight; };
function bubble(kind, text){
  const d = document.createElement("div");
  d.className = "b " + kind; d.textContent = text;
  $("chat").append(d); scrollDown(); return d;
}

async function explain(v, text){
  const my = ++tapId; curB = bi; curC = ci; curV = v; convo = [];
  $("ref").textContent = `${books[bi].name} ${ci+1}:${v}`;
  $("quote").textContent = text;
  $("out").textContent = ""; $("chat").innerHTML = ""; $("note").hidden = true; $("ask").hidden = true;
  $("status").textContent = "Loading the answer…";
  $("panel").classList.add("open");
  try {
    const d = await callApi({ action: "explain", b: curB, c: curC, v });
    if (my !== tapId) return;
    $("status").textContent = ""; $("out").textContent = d.text;
    convo = [{ role: "user", content: "Explain this verse." }, { role: "assistant", content: d.text }];
    $("note").hidden = false; $("ask").hidden = false;
  } catch (e) { if (my === tapId) $("status").textContent = e.message; }
}

async function ask(){
  const q = $("q").value.trim();
  if (!q || busy || convo.length < 2) return;
  busy = true; $("q").value = ""; $("send").disabled = true;
  const my = tapId;
  bubble("you", q);
  const el = bubble("ai", "Loading the answer…");
  try {
    const d = await callApi({ action: "ask", b: curB, c: curC, v: curV, question: q, history: convo.slice(-6) });
    if (my !== tapId) return;
    el.textContent = d.text; scrollDown();
    convo.push({ role: "user", content: q }, { role: "assistant", content: d.text });
    if (typeof d.remaining === "number") $("left").textContent = `${d.remaining} questions left today.`;
  } catch (e) { el.textContent = e.message; }
  finally { busy = false; $("send").disabled = false; }
}
$("send").onclick = ask;
$("q").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); ask(); } });
const verseText = (c, i) => (books[bi].chapters[c] || [])[i] || "";

start();
</script>
</body>
</html>
